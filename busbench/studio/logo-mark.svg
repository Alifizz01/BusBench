<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>BusBench</title>
  <rect width="64" height="64" rx="14" fill="#121A25"/>
  <!-- a frame on the wire, field by field: id, control, status, data, checksum -->
  <rect x="10" y="14" width="11" height="12" rx="2" fill="#3D63DD"/>
  <rect x="22.5" y="14" width="5" height="12" rx="1.5" fill="#8A5CD6"/>
  <rect x="29" y="14" width="6" height="12" rx="1.5" fill="#D3901A"/>
  <rect x="36.5" y="14" width="11" height="12" rx="1.5" fill="#159A78"/>
  <rect x="49" y="14" width="5" height="12" rx="2" fill="#D6455D"/>
  <!-- the bus and the nodes tapped onto it -->
  <line x1="8" y1="38" x2="56" y2="38" stroke="#A9B4C3" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#A9B4C3" stroke-width="2.4"><line x1="17" y1="38" x2="17" y2="45"/><line x1="32" y1="38" x2="32" y2="45"/><line x1="47" y1="38" x2="47" y2="45"/></g>
  <rect x="12.5" y="44.5" width="9" height="7" rx="1.8" fill="#A9B4C3"/>
  <rect x="27.5" y="44.5" width="9" height="7" rx="1.8" fill="#F06A1D"/>
  <rect x="42.5" y="44.5" width="9" height="7" rx="1.8" fill="#A9B4C3"/>
</svg>
